<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- PortsApp mark (three linked servers), drawn on whole pixels of a 16px grid so it stays sharp in browser tabs. -->
  <rect width="16" height="16" rx="3" fill="#0f1316" shape-rendering="geometricPrecision"/>
  <g fill="#f0a830">
    <rect x="6" y="2" width="4" height="4"/>
    <rect x="7" y="6" width="2" height="2"/>
    <rect x="3" y="7" width="10" height="2"/>
    <rect x="3" y="9" width="2" height="1"/>
    <rect x="11" y="9" width="2" height="1"/>
    <rect x="2" y="10" width="4" height="4"/>
    <rect x="10" y="10" width="4" height="4"/>
  </g>
</svg>
